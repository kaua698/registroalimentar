<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Registre as refeições dos seus pets e acompanhe a meta de cada um." />
    <meta name="theme-color" content="#0F1012" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Diário de Alimentação Pet</title>
    <script>
      // Aplica o tema salvo antes de pintar a tela (evita piscar claro/escuro)
      try {
        var t = localStorage.getItem('diariopet:tema');
        document.documentElement.dataset.theme = t === 'claro' ? 'claro' : 'escuro';
      } catch (e) {
        document.documentElement.dataset.theme = 'escuro';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
